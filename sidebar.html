<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidebar</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <button onclick="openSidebar()" id="openSideBarBtn">&#9776;</button>
    <div id="sidebar">
        <ul>
            <li><button onclick="closeSidebar()" id="closeSidebarBtn">Close X</button></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">about</a></li>
            <li><a href="#">contact</a></li>
        </ul>
    </div>
    <script>
        function openSidebar() {
            document.getElementById("sidebar").style.display = "block";
            document.getElementById("openSideBarBtn").style.display = "none";
        }

        function closeSidebar() {
            document.getElementById("sidebar").style.display = "none";
            document.getElementById("openSideBarBtn").style.display = "block";
        }
    </script>
</body>
</html>
