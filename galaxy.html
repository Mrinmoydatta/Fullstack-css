<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Galaxy System</title>
    <link rel="stylesheet" href="galaxy.css">
</head>
<body>
    <div class="container">
        <h1>Solar System</h1>
        
        <!-- Sun -->
        <div class="sun"></div>
        
        <!-- Mercury Orbit -->
        <div class="orbit orbit-mercury">
            <div class="planet mercury"></div>
        </div>
        
        <!-- Venus Orbit -->
        <div class="orbit orbit-venus">
            <div class="planet venus"></div>
        </div>
        
        <!-- Earth Orbit -->
        <div class="orbit orbit-earth">
            <div class="planet earth">
                <div class="moon"></div>
            </div>
        </div>
        
        <!-- Mars Orbit -->
        <div class="orbit orbit-mars">
            <div class="planet mars"></div>
        </div>
        
        <!-- Jupiter Orbit -->
        <div class="orbit orbit-jupiter">
            <div class="planet jupiter"></div>
        </div>
        
        <!-- Saturn Orbit -->
        <div class="orbit orbit-saturn">
            <div class="planet saturn"></div>
        </div>
        
        <!-- Uranus Orbit -->
        <div class="orbit orbit-uranus">
            <div class="planet uranus"></div>
        </div>
        
        <!-- Neptune Orbit -->
        <div class="orbit orbit-neptune">
            <div class="planet neptune"></div>
        </div>
    </div>
</body>
</html>
